# webgl/ 폴더(유니티 WebGL 빌드 산출물)가 push되면 GitHub Pages로 배포.
# 사전 조건: 레포 Settings > Pages > Source = "GitHub Actions".
name: Deploy WebGL to Pages

on:
  push:
    branches: [main]
    paths: ['webgl/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webgl
      - uses: actions/deploy-pages@v4
        id: deployment
