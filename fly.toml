# fly.io 배포 설정. 친구방이 인메모리(단일 프로세스)라 머신 1대 고정이 전제 —
# 배포 후 `fly scale count 1` 확인. auto_stop 끔(방 유실/콜드스타트 방지).
app = "bbong"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
